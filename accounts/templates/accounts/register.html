{% extends "core/base.html" %}
{% block title %}注册{% endblock %}

{% block content %}
  <h1>注册一个账号</h1>
  <p>注册之后就能报名活动。生日不填的话，报名时按未成年人处理（要填家长同意）。</p>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">注册</button>
  </form>

  <p>已经有账号了？<a href="{% url 'accounts:login' %}">登录</a></p>
{% endblock %}
