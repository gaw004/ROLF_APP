{% comment %}
button.html 挑好变体之后落地的那一层。分成两个文件是为了让四个变体只写一次
标签结构 —— 否则 <a> 和 <button> 的区别要在四个分支里各抄一遍。

⚠️ 二次确认走 Alpine 的 x-on:click，不用原生 onclick。
   理由是 D24 的三层分工：JS 全归 HTMX 和 Alpine 两层管，而一个内联 onclick
   是第三种写法 —— 将来上 CSP 时它会是唯一挡路的东西。
   确认框是纯 UI 状态，正好落在 Alpine 的职责里。

⚠️ Alpine 没加载出来时按钮**照常提交**，只是少了确认框。这是有意的降级：
   确认框防的是手滑，不是越权 —— 越权由服务端挡，那一层不依赖任何 JS。

⚠️ `opens` 只能配 `href` 用，而且**必须**配 `href`（2026-08-06）。它的全部意思是
   「有 JS 时开这个弹窗，没 JS 时就正常跳到 href 那一页」—— 所以 href 指的那一页
   得真的存在、真的能完成同一件事。一个 `x-on:click` 挂在没有 href 的按钮上，
   在 Alpine 没加载出来时是一个**点了没反应**的死按钮。

⚠️ `opens` 和 `confirm` 不能同时给：两者都要写 x-on:click，而「先确认再开弹窗」
   本身也说不通 —— 弹窗里那个提交按钮才是该确认的地方。

⚠️ `hx_get` 只落在**这一支**（`<a>`），而且必须配 `href`（2026-08-19 加）。
   它的全部意思是「有 htmx 时就地换掉某一块，没有时跳到 href 那一页」——
   和 `opens` 同一个形状的降级承诺，所以 href 指的那一页得真的存在、真的能
   完成同一件事。
   ⚠️ **不许配 `opens`。** `opens` 写的是 `x-on:click.prevent`，而 `.prevent` 在
      htmx 没接管的那一档会把跳转也拦掉 —— 于是降级路径变成一颗死按钮，
      而这在有 JS 的开发机上永远看不出来。
   ⚠️ `hx_target` 必填。漏了的话渲染出 `hx-target=""`，htmx 把它当成没写、
      于是内容换到**这颗按钮自己**身上：按钮消失，一整块详情长在原地。
      不报错。

⚠️ `disabled` 只落在下面 `<button>` 那一支。上面那一支是 `<a>`，而 `<a>` 根本
   没有 disabled 属性 —— 同时给 href 和 disabled 的话，这里不会报任何错，
   渲染出来是一个**看着灰、点了照样跳**的链接。理由和用法写在 button.html。
   基础 class 串里的 `disabled:opacity-50 disabled:pointer-events-none`
   就是给这一支用的。
{% endcomment %}
{% if href %}
  <a href="{{ href }}" class="{{ cls }}{% if full %} w-full{% endif %}"
     {% if hx_get %}hx-get="{{ hx_get }}" hx-target="{{ hx_target }}"
                    hx-swap="innerHTML"{% endif %}
     {% if opens %}x-on:click.prevent="{{ opens }} = true"{% endif %}
     {% if confirm %}x-on:click="if (!window.confirm('{{ confirm|escapejs }}')) $event.preventDefault()"{% endif %}>{{ label }}</a>
{% else %}
  {% comment %}
  ⚠️ `toggles` 强制 `type="button"`，**不接受调用方传别的**。它几乎总是长在
     表单里（第一个用它的是筛选卡上的 Schedule），而默认的 submit 会让点一下
     开关变成提交一次筛选 —— 整页重来、状态归零，表现是「点了没反应」。
     把它交给调用方记住，就是把一个必然会被忘的细节交出去。
  {% endcomment %}
  <button type="{% if toggles %}button{% else %}{{ type|default:'submit' }}{% endif %}"
          class="{{ cls }}{% if full %} w-full{% endif %}"
          {% if disabled %}disabled{% endif %}
          {% if toggles %}x-on:click="{{ toggles }} = !{{ toggles }}"
                          x-bind:aria-pressed="{{ toggles }}"
                          {% if controls %}aria-controls="{{ controls }}"{% endif %}{% endif %}
          {% if name %}name="{{ name }}" value="{{ value }}"{% endif %}
          {% if prints %}x-on:click="window.print()"{% endif %}
          {% if confirm %}x-on:click="if (!window.confirm('{{ confirm|escapejs }}')) $event.preventDefault()"{% endif %}>{{ label }}</button>
{% endif %}
