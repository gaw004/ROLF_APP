{% if recent_signups %}
  <ul class="space-y-2">
    {% for row in recent_signups %}
      <li class="-mx-2 px-2 py-1.5">
        <span class="block truncate text-sm">{{ row.contact }}</span>
        <span class="block truncate text-xs text-ink-600 dark:text-ink-300">
          {{ row.event_role.event.name }} · {{ row.event_role.role.name }}
        </span>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="text-sm text-ink-600 dark:text-ink-300">No signups yet.</p>
{% endif %}
