两页共用的时间段筛选。

⭐ 这是一个**读操作**，所以按 D24 的口径它可以只有 HTMX 一条路 —— 但它偏偏
   不需要：`method="get"` 的普通表单本来就能用，HTMX 只是省掉整页重绘。
   关掉 JavaScript，筛选照样工作（见下面 `<noscript>` 里那颗按钮）。

⚠️ **实时筛选**（2026-08-17）：不再有 `Filter` 按钮，改字、改日期、换 ministry
   都在停手 400ms 之后自己去取。三件事因此变了，都写在下面表单标签那一段：
   触发器、`hx-replace-url`、以及那颗只对没有 JS 的人存在的提交按钮。

参数：
  action          表单要打的 URL
  report_button   真值 → 多一个「Generate report」按钮（只有管理列表用）
  schedule_button 真值 → 多一个「Schedule」按钮（**只负责打开**，关掉归日程面板
                  右上角那颗 ×），外加一个隐藏的 `from`（日程翻到了哪一天）。
                  只有 Events 页用。
  schedule_from   配 schedule_button 用，当前日程窗口的第一天
  scope           可选。给了就随表单一起提交（隐藏字段），并且带进「Clear」

⚠️ `scope` 必须是**隐藏字段**，不能只写在 action 的查询串里。`method="get"` 的表单
   提交时浏览器会把 action 上的查询串**整个丢掉**，换成表单自己序列化出来的那一份 ——
   于是「全基金会」这一页一按 Filter 就悄悄退回成「我管的那几个 ministry」，
   而列表看起来完全正常（只是少了别人的活动）。
   翻页不受影响，那边走 `{% templatetag openblock %} querystring {% templatetag closeblock %}`，它保留全部参数。

{% comment %}
实时筛选的三条属性，每一条都在挡一个具体的毛病：

⚠️ `hx-trigger="input delay:400ms, submit"` —— 事件从各个输入框**冒泡到表单**，
   所以一条写在这里就够，不必给每个字段各挂一份（字段是 `field.html` 渲染的，
   给它加 hx 属性就等于让全站所有表单都长出筛选的行为）。

   ⚠️ 用 `input` 而**不是** `keyup`：`keyup` 抓不到从剪贴板粘进来的字、
      抓不到手机输入法的候选词、也抓不到浏览器给 `type="search"` 那颗清除按钮。
      三种情况的表现都一样 —— 框里的字变了，列表没动。

   ⚠️ 不写 `changed`：那个修饰符读的是**挂着触发器的那个元素**的 `value`，
      而这里挂在 `<form>` 上，`form.value` 是 undefined —— 于是「值变了没」
      永远答「没变」，一次请求都不会发出去。

   ⚠️ 400ms 这一档同样落在下拉框和日期框上（它们也发 `input`），
      所以选一个 ministry 之后也要等这 400ms。知情的取舍：换成
      `input, change` 两个触发器的话，选一次下拉会**发两次请求**
      （`change` 立刻发，`input` 的 400ms 到点再发一次）。

   ⚠️ `submit` 要留着：没有提交按钮的表单，在文本框里按回车时浏览器
      **仍然可能**触发隐式提交（几个字段时各家行为不一）。不接住它，
      按一次回车就是一次整页刷新。

⚠️ `hx-replace-url` 而不是 `hx-push-url`：实时筛选下，push 是**每敲一个字
   （防抖之后）往历史里塞一条**。搜 "kitchen" 之后想退回上一页，得按七次后退。
   replace 保住了「这一份筛选可以被收藏、被转发」，同时让后退键仍然是
   「回到我进来之前那一页」。

⚠️ `hx-sync="this:replace"` —— 防抖**减少**并发，但消不掉它：网慢的时候
   「kitchen」那次的请求可能比「kitch」那次先发出、后回来，而 htmx 默认是
   谁回来谁贴上去。表现是**列表显示的是你上一个字的结果**，而搜索框里写着
   新的字；下一次敲键又会自己好，所以它看起来像「偶尔抽一下」。
   `replace` 让新的一次直接顶掉还在飞的那一次，于是屏幕上永远是最后一次输入的答案。

⚠️ `hx-indicator` 比原来更要紧：以前有按钮，按下去就是反馈；现在唯一说明
   「你的字已经收到了、正在取」的东西就是它。
{% endcomment %}
<form method="get" action="{{ action }}"
      hx-get="{{ action }}" hx-target="#event-results" hx-swap="outerHTML"
      hx-trigger="input delay:400ms, submit"
      hx-sync="this:replace"
      hx-replace-url="true" hx-indicator="#filter-busy"
