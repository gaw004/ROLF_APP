   都在停手 400ms 之后自己去取。三件事因此变了，都写在下面表单标签那一段：

实时筛选的三条属性，每一条都在挡一个具体的毛病：

⚠️ `hx-trigger="input delay:400ms, submit"` —— 事件从各个输入框**冒泡到表单**，
   所以一条写在这里就够，不必给每个字段各挂一份（字段是 `field.html` 渲染的，
   给它加 hx 属性就等于让全站所有表单都长出筛选的行为）。

   ⚠️ 用 `input` 而**不是** `keyup`：`keyup` 抓不到从剪贴板粘进来的字、
      抓不到手机输入法的候选词、也抓不到浏览器给 `type="search"` 那颗清除按钮。
      三种情况的表现都一样 —— 框里的字变了，列表没动。

   ⚠️ 不写 `changed`：那个修饰符读的是**挂着触发器的那个元素**的 `value`，
      而这里挂在 `<form>` 上，`form.value` 是 undefined —— 于是「值变了没」
      永远答「没变」，一次请求都不会发出去。

   ⚠️ 400ms 这一档同样落在下拉框和日期框上（它们也发 `input`），
      所以选一个 ministry 之后也要等这 400ms。知情的取舍：换成
      `input, change` 两个触发器的话，选一次下拉会**发两次请求**
      （`change` 立刻发，`input` 的 400ms 到点再发一次）。

   ⚠️ `submit` 要留着：没有提交按钮的表单，在文本框里按回车时浏览器
      **仍然可能**触发隐式提交（几个字段时各家行为不一）。不接住它，
      按一次回车就是一次整页刷新。

⚠️ `hx-replace-url` 而不是 `hx-push-url`：实时筛选下，push 是**每敲一个字
   （防抖之后）往历史里塞一条**。搜 "kitchen" 之后想退回上一页，得按七次后退。
   replace 保住了「这一份筛选可以被收藏、被转发」，同时让后退键仍然是
   「回到我进来之前那一页」。

⚠️ `hx-sync="this:replace"` —— 防抖**减少**并发，但消不掉它：网慢的时候
   「kitchen」那次的请求可能比「kitch」那次先发出、后回来，而 htmx 默认是
   谁回来谁贴上去。表现是**列表显示的是你上一个字的结果**，而搜索框里写着
   新的字；下一次敲键又会自己好，所以它看起来像「偶尔抽一下」。
   `replace` 让新的一次直接顶掉还在飞的那一次，于是屏幕上永远是最后一次输入的答案。

⚠️ `hx-indicator` 比原来更要紧：以前有按钮，按下去就是反馈；现在唯一说明
   「你的字已经收到了、正在取」的东西就是它。
{% endcomment %}
