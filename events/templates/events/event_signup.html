{% extends "core/base.html" %}
{% block title %}报名 {{ event.name }}{% endblock %}

{% block content %}
  <h1>报名：{{ event.name }}</h1>
  {% if needs_consent %}
    <p>
      你还未成年（或者系统里没有你的生日），所以要填家长/监护人的同意。
      <strong>邮箱和电话至少填一个</strong> —— 活动改时间的时候要通知得到他们。
    </p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">确认报名</button>
  </form>

  <p><a href="{% url 'events:event_detail' event.pk %}">返回</a></p>
{% endblock %}
